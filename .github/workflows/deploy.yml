name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Also started every day by daily.yml, and by hand from the Actions tab. The schedule lives there
  # because GitHub disables a scheduled workflow after 60 days without a commit, and a disabled
  # workflow ignores pushes too.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Lets src/lib/github.ts call the GitHub API without the anonymous rate limit.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: src/lib/last-modified.mjs dates each post's last edit from git.
          fetch-depth: 0
      - uses: withastro/action@v6
        with:
          # A restored content cache can carry post HTML rendered by an older markdown plugin.
          cache: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
