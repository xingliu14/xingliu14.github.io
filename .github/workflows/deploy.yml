name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  schedule:
    # Daily at 09:17 UTC: refreshes the projects list and What's New, and retires NEW! tags,
    # with no commit needed.
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Lets src/lib/github.ts call the GitHub API without the anonymous rate limit.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: src/lib/last-modified.mjs dates each post's last edit from git.
          fetch-depth: 0
      - uses: withastro/action@v6
        with:
          # A restored content cache can carry post HTML rendered by an older markdown plugin.
          cache: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
